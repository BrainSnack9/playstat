name: Keepalive Workflow

on:
  schedule:
    # 50일마다 실행 (60일 비활성화 방지)
    - cron: '0 0 1,21 * *'
  workflow_dispatch:

jobs:
  keepalive:
    name: Keep workflows alive
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Keepalive - update timestamp
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "chore: keepalive commit to prevent workflow disabling"
          git push
